version: 2

models:

  # ============================================================
  # MART: SKILL DEMAND
  # ============================================================

  - name: mart_skill_demand
    description: >
      Aggregated technology and skill demand across canonical
      job postings.

    columns:
      - name: SkillName
        tests:
          - not_null
          - unique

      - name: JobCount
        tests:
          - not_null

      - name: CompanyCount
        tests:
          - not_null


  # ============================================================
  # MART: ROLE SKILL DEMAND
  # ============================================================

  - name: mart_role_skill_demand
    description: >
      Skill demand aggregated by normalized job role.
      Used to understand which technologies are most frequently
      requested for each role.

    columns:
      - name: RoleName
        tests:
          - not_null

      - name: SkillName
        tests:
          - not_null

      - name: JobCount
        tests:
          - not_null

      - name: CompanyCount
        tests:
          - not_null


  # ============================================================
  # MART: COMPANY TECH STACK
  # ============================================================

  - name: mart_company_tech_stack
    description: >
      Technology demand aggregated by company.
      Provides an approximation of the technology stack visible
      in each company's job postings.

    columns:
      - name: CompanyName
        tests:
          - not_null

      - name: SkillName
        tests:
          - not_null

      - name: JobCount
        tests:
          - not_null


  # ============================================================
  # MART: SOURCE QUALITY
  # ============================================================

  - name: mart_source_quality
    description: >
      Data quality and coverage metrics by source system.
      Used to monitor ingestion quality across job data sources.

    columns:
      - name: SourceSystem
        tests:
          - not_null
          - unique

      - name: JobCount
        tests:
          - not_null


  # ============================================================
  # MART: SKILL TREND
  # ============================================================

  - name: mart_skill_trend
    description: >
      Time-based skill demand derived from job observations.
      Used to analyze changes in technology demand over time.

    columns:
      - name: SkillName
        tests:
          - not_null

      - name: ObservationDate
        tests:
          - not_null

      - name: JobCount
        tests:
          - not_null


  # ============================================================
  # MART: CAREER AREA OVERVIEW
  # ============================================================

  - name: mart_career_area_overview
    description: >
      High-level technology job market distribution by Career Area.
      Includes job counts, company coverage, source coverage,
      classification confidence and market share.

    columns:
      - name: CareerAreaName
        tests:
          - not_null
          - unique

      - name: JobCount
        tests:
          - not_null

      - name: CompanyCount
        tests:
          - not_null

      - name: SourceCount
        tests:
          - not_null

      - name: HighConfidenceJobCount
        tests:
          - not_null

      - name: MediumConfidenceJobCount
        tests:
          - not_null

      - name: LowConfidenceJobCount
        tests:
          - not_null

      - name: TotalTechJobCount
        tests:
          - not_null

      - name: JobSharePercentage
        tests:
          - not_null

      - name: FirstObservedAt
        tests:
          - not_null

      - name: LastObservedAt
        tests:
          - not_null


  # ============================================================
  # MART: ROLE × SENIORITY DEMAND
  # ============================================================

  - name: mart_role_seniority_demand
    description: >
      Technology job demand aggregated by Career Area,
      normalized Role and Seniority. Provides role-level,
      Career Area-level and total technology market demand
      metrics for Career Intelligence analytics.

    columns:
      - name: CareerAreaName
        tests:
          - not_null

      - name: RoleName
        tests:
          - not_null

      - name: Seniority
        tests:
          - not_null

      - name: JobCount
        tests:
          - not_null

      - name: CompanyCount
        tests:
          - not_null

      - name: SourceCount
        tests:
          - not_null

      - name: RoleJobCount
        tests:
          - not_null

      - name: CareerAreaJobCount
        tests:
          - not_null

      - name: TotalTechJobCount
        tests:
          - not_null

      - name: SeniorityShareWithinRole
        tests:
          - not_null

      - name: DemandShareWithinCareerArea
        tests:
          - not_null

      - name: TechMarketShare
        tests:
          - not_null

      - name: FirstObservedAt
        tests:
          - not_null

      - name: LastObservedAt
        tests:
          - not_null